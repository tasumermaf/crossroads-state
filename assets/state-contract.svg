<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="710" viewBox="0 0 1500 710" role="img" aria-labelledby="title desc">
<title id="title">What a passive coordinate change preserves</title><desc id="desc">A four-address exact state is relabeled by one step. Values, ordered reader and reference move together; the observed pair remains 2,5. The inverse restores the complete initial state.</desc>
<defs><radialGradient id="nightglow"><stop stop-color="#281D3C"/><stop offset="1" stop-color="#0D0D1B"/></radialGradient>
<linearGradient id="sweep"><stop stop-color="#AC88E2"/><stop offset=".55" stop-color="#73DAB1"/><stop offset="1" stop-color="#E8C985"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#73DAB1"/></marker>
<marker id="goldarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#E8C985"/></marker></defs>
<rect width="1500" height="710" fill="#0D0D1B"/>
<text x="52" y="66" font-family="Arial, sans-serif" font-size="19" fill="#E8C985" letter-spacing="2.2">ONE OPERATION. THREE THINGS MOVE.</text>
<text x="52" y="116" font-family="Georgia, serif" font-size="34" fill="#F0EAF7" >The reading stays the same. The address labels change.</text>
<rect x="52" y="158" width="580" height="357" rx="12" fill="#161423" stroke="#5D4B74" stroke-opacity=".65"/>
<text x="82" y="204" font-family="Arial, sans-serif" font-size="18" fill="#AC88E2" letter-spacing="2">INITIAL STATE</text>
<text x="139" y="252" font-family="Arial, sans-serif" font-size="14" fill="#AAA6BD" text-anchor="middle">address 0</text>
<rect x="92" y="268" width="94" height="86" rx="5" fill="#241D33" stroke="#74608E"/>
<text x="139" y="323" font-family="Georgia, serif" font-size="36" fill="#F0EAF7" text-anchor="middle">2</text>
<rect x="91" y="267" width="96" height="88" rx="5" fill="none" stroke="#73DAB1" stroke-width="2"/>
<circle cx="139" cy="376" r="12" fill="#73DAB1" stroke="none" stroke-width="1" opacity="1"/>
<text x="139" y="381" font-family="Arial, sans-serif" font-size="13" fill="#0D0D1B" text-anchor="middle" font-weight="bold">1</text>
<text x="272" y="252" font-family="Arial, sans-serif" font-size="14" fill="#AAA6BD" text-anchor="middle">address 1</text>
<rect x="225" y="268" width="94" height="86" rx="5" fill="#241D33" stroke="#74608E"/>
<text x="272" y="323" font-family="Georgia, serif" font-size="36" fill="#F0EAF7" text-anchor="middle">7</text>
<circle cx="272" cy="310" r="57" fill="none" stroke="#E8C985" stroke-width="1.3" opacity="1"/>
<text x="272" y="418" font-family="Arial, sans-serif" font-size="14" fill="#E8C985" text-anchor="middle">reference</text>
<text x="405" y="252" font-family="Arial, sans-serif" font-size="14" fill="#AAA6BD" text-anchor="middle">address 2</text>
<rect x="358" y="268" width="94" height="86" rx="5" fill="#241D33" stroke="#74608E"/>
<text x="405" y="323" font-family="Georgia, serif" font-size="36" fill="#F0EAF7" text-anchor="middle">-3</text>
<text x="538" y="252" font-family="Arial, sans-serif" font-size="14" fill="#AAA6BD" text-anchor="middle">address 3</text>
<rect x="491" y="268" width="94" height="86" rx="5" fill="#241D33" stroke="#74608E"/>
<text x="538" y="323" font-family="Georgia, serif" font-size="36" fill="#F0EAF7" text-anchor="middle">5</text>
<rect x="490" y="267" width="96" height="88" rx="5" fill="none" stroke="#73DAB1" stroke-width="2"/>
<circle cx="538" cy="376" r="12" fill="#73DAB1" stroke="none" stroke-width="1" opacity="1"/>
<text x="538" y="381" font-family="Arial, sans-serif" font-size="13" fill="#0D0D1B" text-anchor="middle" font-weight="bold">2</text>
<line x1="81" y1="439" x2="603" y2="439" stroke="#AC88E2" stroke-width="1" opacity="0.3" />
<text x="82" y="473" font-family="Arial, sans-serif" font-size="12" fill="#AAA6BD" letter-spacing="1.5">READ IN ORDER</text>
<text x="229" y="475" font-family="Arial, sans-serif" font-size="19" fill="#73DAB1" >0 → 3</text>
<text x="407" y="475" font-family="Arial, sans-serif" font-size="18" fill="#F0EAF7" >observed (2, 5)</text>
<rect x="868" y="158" width="580" height="357" rx="12" fill="#161423" stroke="#5D4B74" stroke-opacity=".65"/>
<text x="898" y="204" font-family="Arial, sans-serif" font-size="18" fill="#AC88E2" letter-spacing="2">RELABELLED STATE</text>
<text x="955" y="252" font-family="Arial, sans-serif" font-size="14" fill="#AAA6BD" text-anchor="middle">address 0</text>
<rect x="908" y="268" width="94" height="86" rx="5" fill="#241D33" stroke="#74608E"/>
<text x="955" y="323" font-family="Georgia, serif" font-size="36" fill="#F0EAF7" text-anchor="middle">5</text>
<rect x="907" y="267" width="96" height="88" rx="5" fill="none" stroke="#73DAB1" stroke-width="2"/>
<circle cx="955" cy="376" r="12" fill="#73DAB1" stroke="none" stroke-width="1" opacity="1"/>
<text x="955" y="381" font-family="Arial, sans-serif" font-size="13" fill="#0D0D1B" text-anchor="middle" font-weight="bold">2</text>
<text x="1088" y="252" font-family="Arial, sans-serif" font-size="14" fill="#AAA6BD" text-anchor="middle">address 1</text>
<rect x="1041" y="268" width="94" height="86" rx="5" fill="#241D33" stroke="#74608E"/>
<text x="1088" y="323" font-family="Georgia, serif" font-size="36" fill="#F0EAF7" text-anchor="middle">2</text>
<rect x="1040" y="267" width="96" height="88" rx="5" fill="none" stroke="#73DAB1" stroke-width="2"/>
<circle cx="1088" cy="376" r="12" fill="#73DAB1" stroke="none" stroke-width="1" opacity="1"/>
<text x="1088" y="381" font-family="Arial, sans-serif" font-size="13" fill="#0D0D1B" text-anchor="middle" font-weight="bold">1</text>
<text x="1221" y="252" font-family="Arial, sans-serif" font-size="14" fill="#AAA6BD" text-anchor="middle">address 2</text>
<rect x="1174" y="268" width="94" height="86" rx="5" fill="#241D33" stroke="#74608E"/>
<text x="1221" y="323" font-family="Georgia, serif" font-size="36" fill="#F0EAF7" text-anchor="middle">7</text>
<circle cx="1221" cy="310" r="57" fill="none" stroke="#E8C985" stroke-width="1.3" opacity="1"/>
<text x="1221" y="418" font-family="Arial, sans-serif" font-size="14" fill="#E8C985" text-anchor="middle">reference</text>
<text x="1354" y="252" font-family="Arial, sans-serif" font-size="14" fill="#AAA6BD" text-anchor="middle">address 3</text>
<rect x="1307" y="268" width="94" height="86" rx="5" fill="#241D33" stroke="#74608E"/>
<text x="1354" y="323" font-family="Georgia, serif" font-size="36" fill="#F0EAF7" text-anchor="middle">-3</text>
<line x1="897" y1="439" x2="1419" y2="439" stroke="#AC88E2" stroke-width="1" opacity="0.3" />
<text x="898" y="473" font-family="Arial, sans-serif" font-size="12" fill="#AAA6BD" letter-spacing="1.5">READ IN ORDER</text>
<text x="1045" y="475" font-family="Arial, sans-serif" font-size="19" fill="#73DAB1" >1 → 0</text>
<text x="1223" y="475" font-family="Arial, sans-serif" font-size="18" fill="#F0EAF7" >observed (2, 5)</text>
<line x1="666" y1="316" x2="842" y2="316" stroke="#73DAB1" stroke-width="2" opacity="1" marker-end="url(#arrow)"/>
<text x="754" y="278" font-family="Arial, sans-serif" font-size="19" fill="#73DAB1" text-anchor="middle">relabel +1</text>
<text x="754" y="352" font-family="Arial, sans-serif" font-size="14" fill="#AAA6BD" text-anchor="middle">old address i</text>
<text x="754" y="377" font-family="Arial, sans-serif" font-size="14" fill="#AAA6BD" text-anchor="middle">becomes i + 1</text>
<text x="754" y="402" font-family="Arial, sans-serif" font-size="14" fill="#AAA6BD" text-anchor="middle">3 wraps to 0</text>
<path d="M1158,535 L1158,569 Q1158,588 1139,588 L362,588 Q343,588 343,569 L343,535" fill="none" stroke="#E8C985" stroke-width="1.6" marker-end="url(#goldarrow)"/>
<rect x="585" y="567" width="330" height="40" fill="#0D0D1B"/>
<text x="750" y="591" font-family="Arial, sans-serif" font-size="19" fill="#E8C985" text-anchor="middle">inverse −1 · complete return</text>
<text x="52" y="661" font-family="Arial, sans-serif" font-size="15" fill="#AC88E2" >PURPLE  values at every address</text>
<text x="527" y="661" font-family="Arial, sans-serif" font-size="15" fill="#73DAB1" >GREEN  reader order</text>
<text x="931" y="661" font-family="Arial, sans-serif" font-size="15" fill="#E8C985" >GOLD  carried reference</text>
</svg>